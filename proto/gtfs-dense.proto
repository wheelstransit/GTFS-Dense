syntax = "proto3";

package gtfsch;

// A top-level container for all the transit data for a region.
// This is the message that will be serialized to a .gtfsd file.
message TransitFeed {
    // Metadata about the feed itself
    FeedHeader header = 1;

    // All unique entities, stored in lists.
    // Trips and StopTimes will reference these by their index, not by ID.
    repeated Agency agencies = 2;
    repeated Route routes = 3;
    repeated Stop stops = 4;
    repeated Calendar calendars = 5;
    repeated CalendarDate calendar_dates = 6;
    repeated Trip trips = 7;

    // Fare-related data
    repeated FareAttribute fare_attributes = 8;
    repeated FareRule fare_rules = 9;

    // Language translations
    repeated Translation translations = 10;
    repeated Transfer transfers = 11;
    repeated Pathway pathways = 12;
    repeated Level levels = 13;
}

message FeedHeader {
    // The version of the GTFS-Dense spec this file conforms to.
    string gtfs_dense_version = 1;
    // Timestamp (Unix epoch) of when the file was generated.
    uint64 timestamp = 2;
    // Information from the (optional) feed_info.txt
    string feed_publisher_name = 3;
    string feed_publisher_url = 4;
    string feed_lang = 5;
    optional string feed_version = 7;
    optional uint32 feed_start_date = 8;
    optional uint32 feed_end_date = 9;
    // The version of this feed, used for diffing.
    uint32 version = 6;
}

// See agency.txt in the GTFS spec.
message Agency {
    string agency_name = 1;
    string agency_url = 2;
    string agency_timezone = 3;
    string agency_lang = 4;
    string agency_phone = 5;
    string agency_fare_url = 6;
    optional string agency_id = 7;
}

// See route_type in the GTFS spec for these enum values.
enum RouteType {
    TRAM = 0;
    SUBWAY = 1;
    RAIL = 2;
    BUS = 3;
    FERRY = 4;
    CABLE_TRAM = 5;
    AERIAL_LIFT = 6;
    FUNICULAR = 7;
    TROLLEYBUS = 11;
    MONORAIL = 12;
    // Extended GTFS route types
    HIGH_SPEED_RAIL = 101;
    LONG_DISTANCE_TRAIN = 102;
    INTER_REGIONAL_RAIL_SERVICE = 103;
    CAR_TRANSPORT_RAIL_SERVICE = 104;
    SLEEPER_RAIL_SERVICE = 105;
    REGIONAL_RAIL = 106;
    TOURIST_RAILWAY = 107;
    RAIL_SHUTTLE = 108;
    SUBURBAN_RAILWAY = 109;
    REPLACEMENT_RAIL_SERVICE = 110;
    SPECIAL_RAIL_SERVICE = 111;
    LORRY_TRANSPORT_RAIL_SERVICE = 112;
    ALL_RAIL_SERVICES = 113;
    CROSS_COUNTRY_RAIL_SERVICE = 114;
    VEHICLE_TRANSPORT_RAIL_SERVICE = 115;
    RACK_AND_PINION_RAILWAY = 116;
    ADDITIONAL_RAIL_SERVICE = 117;
    COACH_SERVICE = 200;
    INTERNATIONAL_COACH_SERVICE = 201;
    NATIONAL_COACH_SERVICE = 202;
    SHUTTLE_COACH_SERVICE = 203;
    REGIONAL_COACH_SERVICE = 204;
    SPECIAL_COACH_SERVICE = 205;
    TOURIST_COACH_SERVICE = 206;
    COMMUTER_COACH_SERVICE = 207;
    ALL_COACH_SERVICES = 208;
    URBAN_RAILWAY_SERVICE = 400;
    ALL_URBAN_RAILWAY_SERVICES = 405;
    METRO_SERVICE = 401;
    UNDERGROUND_SERVICE = 402;
    TUBE_SERVICE = 403;
    URBAN_RAIL_LINK = 404;
    BUS_SERVICE = 700;
    REGIONAL_BUS_SERVICE = 701;
    EXPRESS_BUS_SERVICE = 702;
    STOPPING_BUS_SERVICE = 703;
    LOCAL_BUS_SERVICE = 704;
    NIGHT_BUS_SERVICE = 705;
    POST_BUS_SERVICE = 706;
    SPECIAL_NEEDS_BUS = 707;
    MOBILITY_BUS_SERVICE = 708;
    MOBILITY_BUS_FOR_REGISTERED_DISABLED = 709;
    SIGHTSEEING_BUS = 710;
    SHUTTLE_BUS = 711;
    SCHOOL_BUS = 712;
    SCHOOL_AND_PUBLIC_SERVICE_BUS = 713;
    RAIL_REPLACEMENT_BUS_SERVICE = 714;
    DEMAND_AND_RESPONSE_BUS_SERVICE = 715;
    ALL_BUS_SERVICES = 716;
    TROLLEYBUS_SERVICE = 800;
    TRAM_SERVICE = 900;
    CITY_TRAM_SERVICE = 901;
    LOCAL_TRAM_SERVICE = 902;
    REGIONAL_TRAM_SERVICE = 903;
    SIGHTSEEING_TRAM_SERVICE = 904;
    SHUTTLE_TRAM_SERVICE = 905;
    ALL_TRAM_SERVICES = 906;
    WATER_TRANSPORT_SERVICE = 1000;
    INTERNATIONAL_CAR_FERRY_SERVICE = 1001;
    NATIONAL_CAR_FERRY_SERVICE = 1002;
    REGIONAL_CAR_FERRY_SERVICE = 1003;
    LOCAL_CAR_FERRY_SERVICE = 1004;
    INTERNATIONAL_PASSENGER_FERRY_SERVICE = 1005;
    NATIONAL_PASSENGER_FERRY_SERVICE = 1006;
    REGIONAL_PASSENGER_FERRY_SERVICE = 1007;
    LOCAL_PASSENGER_FERRY_SERVICE = 1008;
    POST_BOAT_SERVICE = 1009;
    TRAIN_FERRY_SERVICE = 1010;
    ROAD_LINK_FERRY_SERVICE = 1011;
    AIRPORT_LINK_FERRY_SERVICE = 1012;
    CAR_HIGH_SPEED_FERRY_SERVICE = 1013;
    PASSENGER_HIGH_SPEED_FERRY_SERVICE = 1014;
    SIGHTSEEING_BOAT_SERVICE = 1015;
    SCHOOL_BOAT = 1016;
    CABLE_DRAWN_BOAT_SERVICE = 1017;
    RIVER_BUS_SERVICE = 1018;
    SCHEDULED_FERRY_SERVICE = 1019;
    SHUTTLE_FERRY_SERVICE = 1020;
    ALL_WATER_TRANSPORT_SERVICES = 1021;
    AIR_SERVICE = 1100;
    FUNICULAR_SERVICE = 1300;
    TAXI_SERVICE = 1500;
    COMMUNAL_TAXI_SERVICE = 1501;
    WATER_TAXI_SERVICE = 1502;
    RAIL_TAXI_SERVICE = 1503;
    BIKE_TAXI_SERVICE = 1504;
    LICENSED_TAXI_SERVICE = 1505;
    PRIVATE_HIRE_SERVICE_VEHICLE = 1506;
    ALL_TAXI_SERVICES = 1507;
    MISCELLANEOUS_SERVICE = 1700;
    HORSE_DRAWN_CARRIAGE = 1702;
}

message Route {
    string route_short_name = 1;
    string route_long_name = 2;
    RouteType route_type = 3;
    string route_color = 4; // Stored as a hex string without '#'
    string route_text_color = 5;
    optional uint32 agency_index = 6; // Points to an Agency message
    optional string route_id = 7;
}

enum LocationType {
    STOP = 0;
    STATION = 1;
    ENTRANCE_EXIT = 2;
    GENERIC_NODE = 3;
    BOARDING_AREA = 4;
}

message Stop {
    string stop_name = 1;
    sfixed32 lat_e5 = 2; //scaled by 1e5 and stored as an integer
    sfixed32 lon_e5 = 3; //same
    optional int32 parent_station_index = 4;
    string zone_id = 5; // For fare calculations
    LocationType location_type = 6;
    optional bool wheelchair_boarding = 7;
    optional string stop_code = 8;
    optional string stop_id = 9;
}

message Trip {
    string trip_headsign = 1;
    uint32 route_index = 2;
    optional uint32 shape_index = 3;
    optional uint32 service_index = 4; // Points to a Calendar message
    bool direction_id = 5;

    // A trip can either have a list of stop times (for scheduled service)
    // or a list of frequencies (for headway-based service).
    repeated StopTime stop_times = 6;
    repeated Frequency frequencies = 7;
    optional string trip_short_name = 8;
    optional bool bikes_allowed = 9;
    optional bool wheelchair_accessible = 10;
    optional string block_id = 11;
    optional string trip_id = 12;
    optional string shape_id = 13; // Original GTFS shape_id (optional)
}

message StopTime {
    uint32 stop_index = 1;
    uint32 arrival_time_seconds = 2;
    uint32 departure_time_seconds = 3;
    uint32 stop_sequence = 4;
    optional string stop_headsign = 5;
}

// From frequencies.txt
message Frequency {
    uint32 start_time_seconds = 1;
    uint32 end_time_seconds = 2;
    uint32 headway_secs = 3;
    // See exact_times in GTFS spec. 0 for frequency-based, 1 for schedule-based.
    uint32 exact_times = 4;
}

message Calendar {
    uint32 days_mask = 1;
    uint32 start_date = 2;
    uint32 end_date = 3;
    // v1.4.0: The original GTFS service_id.
    optional string service_id = 4;
}

message CalendarDate {
    uint32 service_index = 1;
    uint32 date = 2; // Stored as YYYYMMDD
    // 1 for added, 2 for removed.
    uint32 exception_type = 3;
}

// From fare_attributes.txt
message FareAttribute {
    float price = 1;
    string currency_type = 2;
    // 0 for one-time, 1 for pre-paid.
    uint32 payment_method = 3;
    // 0 for 0 transfers, 1 for 1 transfer, 2 for 2 transfers.
    // If empty in GTFS, it means unlimited transfers. We use a high number (e.g., 99) to represent this.
    uint32 transfers = 4;
    optional uint32 agency_index = 5;
    optional uint32 transfer_duration = 6; // In seconds
}

// From fare_rules.txt
message FareRule {
    uint32 fare_attribute_index = 1;
    optional uint32 route_index = 2;
    // These point to zone_id fields in the Stop message.
    // Since zone_ids are strings, we store them directly.
    string origin_id = 3;
    string destination_id = 4;
    string contains_id = 5;
}

// From translations.txt
message Translation {
    // e.g., "stops" or "routes"
    string table_name = 1;
    // e.g., "stop_name" or "route_long_name"
    string field_name = 2;
    string language = 3;
    string translation = 4;
    // The ID of the record this translation applies to, e.g., a specific stop_id.
    string record_id = 5;
}

enum TransferType {
    RECOMMENDED = 0;
    TIMED = 1;
    MINIMUM_TIME = 2;
    NO_TRANSFER = 3;
}

message Transfer {
    uint32 from_stop_index = 1;
    uint32 to_stop_index = 2;
    TransferType type = 3;
    optional uint32 min_transfer_time = 4;
}

message Pathway {
    string pathway_id = 1;
    uint32 from_stop_index = 2;
    uint32 to_stop_index = 3;
    uint32 pathway_mode = 4;
    bool is_bidirectional = 5;
    optional float length = 6;
    optional uint32 traversal_time = 7;
    optional int32 stair_count = 8;
    optional float max_slope = 9;
    optional float min_width = 10;
    string signposted_as = 11;
    string reversed_signposted_as = 12;
}

message Level {
    string level_id = 1;
    float level_index = 2;
    string level_name = 3;
}

// -----------------------------------------------------------------------------
// Shapes Extension
// -----------------------------------------------------------------------------

// Stored in a separate file, not part of the main feed.
message Shape {
    bytes encoded_polyline = 1;
    optional string shape_id = 2; // Original GTFS shape_id
}

// This message is not part of the main feed. It's stored in a separate
// .shapes.gtfsd-idx file and contains an index of all shapes in the feed.
message ShapeIndex {
    repeated ShapeRecord records = 1;
}

// Describes the location of a single shape's data within the corresponding
// .shapes.gtfsd-data file.
message ShapeRecord {
    // The byte offset where the shape's serialized message begins.
    uint64 offset = 1;
    // The byte length of the shape's serialized message.
    uint32 length = 2;
    // The shape ID for direct lookup
    string shape_id = 3;
}


// -----------------------------------------------------------------------------
// Diff/Patch Messages
// -----------------------------------------------------------------------------

message FeedDiff {
    FeedDiffHeader header = 1;

    // Added entities
    repeated Agency added_agencies = 2;
    repeated Route added_routes = 3;
    repeated Stop added_stops = 4;
    repeated Calendar added_calendars = 5;
    repeated CalendarDate added_calendar_dates = 6;
    repeated Trip added_trips = 7;
    repeated FareAttribute added_fare_attributes = 8;
    repeated FareRule added_fare_rules = 9;
    repeated Translation added_translations = 10;
    repeated Shape added_shapes = 11;

    // Updated entities
    repeated UpdatedAgency updated_agencies = 12;
    repeated UpdatedRoute updated_routes = 13;
    repeated UpdatedStop updated_stops = 14;
    repeated UpdatedCalendar updated_calendars = 15;
    repeated UpdatedCalendarDate updated_calendar_dates = 16;
    repeated UpdatedTrip updated_trips = 17;
    repeated UpdatedFareAttribute updated_fare_attributes = 18;
    repeated UpdatedFareRule updated_fare_rules = 19;
    repeated UpdatedTranslation updated_translations = 20;
    repeated UpdatedShape updated_shapes = 21;

    // Deleted entities (by index)
    repeated uint32 deleted_agencies = 22;
    repeated uint32 deleted_routes = 23;
    repeated uint32 deleted_stops = 24;
    repeated uint32 deleted_calendars = 25;
    repeated uint32 deleted_calendar_dates = 26;
    repeated uint32 deleted_trips = 27;
    repeated uint32 deleted_fare_attributes = 28;
    repeated uint32 deleted_fare_rules = 29;
    repeated uint32 deleted_translations = 30;
    repeated uint32 deleted_shapes = 31;
}

message FeedDiffHeader {
    // The version of the base feed this diff applies to.
    uint32 from_version = 1;
    // The version of the feed after this diff is applied.
    uint32 to_version = 2;
    // Timestamp (Unix epoch) of when the diff was generated.
    uint64 timestamp = 3;
    // Checksum of the diff file's content (e.g., SHA-256).
    bytes checksum = 4;
}

message UpdatedAgency {
    uint32 index = 1;
    Agency agency = 2;
}

message UpdatedRoute {
    uint32 index = 1;
    Route route = 2;
}

message UpdatedStop {
    uint32 index = 1;
    Stop stop = 2;
}

message UpdatedShape {
    uint32 index = 1;
    Shape shape = 2;
}

message UpdatedCalendar {
    uint32 index = 1;
    Calendar calendar = 2;
}

message UpdatedCalendarDate {
    uint32 index = 1;
    CalendarDate calendar_date = 2;
}

message UpdatedTrip {
    uint32 index = 1;
    Trip trip = 2;
}

message UpdatedFareAttribute {
    uint32 index = 1;
    FareAttribute fare_attribute = 2;
}

message UpdatedFareRule {
    uint32 index = 1;
    FareRule fare_rule = 2;
}

message UpdatedTranslation {
    uint32 index = 1;
    Translation translation = 2;
}
